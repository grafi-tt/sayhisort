name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

defaults:
  run:
    working-directory: rust

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install toolchain
      run: rustup toolchain install stable --profile minimal --component rustfmt && rustup default stable
    - name: Check formatting
      run: cargo fmt --check

  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v5
    - name: Install toolchain
      run: rustup toolchain install stable --profile minimal && rustup default stable
    - name: Build
      # `--all-targets` also builds the benchmark, which is not run by `cargo test`.
      run: cargo build --all-targets
    - name: Test (debug)
      # Debug build checks integer overflow and the preconditions of unsafe std functions.
      run: cargo test
    - name: Test (release)
      # The optimized build may expose undefined behavior differently.
      run: cargo test --release
